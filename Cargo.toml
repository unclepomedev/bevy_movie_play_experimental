[package]
name = "bevy_movie_play_experimental"
version = "0.0.1"
edition = "2024"
description = "Play a movie in Bevy (currently experimental)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/unclepomedev/bevy_movie_play_experimental"
readme = "README.md"

[dependencies]
bevy = { version = "0.20", default-features = false, features = ["bevy_asset", "bevy_render"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"
bevy = { version = "0.20" }
